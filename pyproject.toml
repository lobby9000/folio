[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folio"
version = "0.1.0"
description = "Scanned documents to structured, searchable fields: OCR, extraction and search, served from AWS Lambda."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luis Ángel Quiroz López" }]
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pytesseract>=0.3.10",
    "rapidfuzz>=3.6",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
folio = "folio.cli:main"

[tool.setuptools.packages.find]
include = ["folio*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
